name: SingleStepTests Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  singlestep-full:
    name: Run full 65C02 SingleStepTests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout main
      uses: actions/checkout@v7
      with:
        ref: main

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore BackPocketEmulator.slnx

    - name: Read pinned vector commit
      id: vectors
      run: |
        commit=$(sed -n 's/.*UpstreamCommit = "\([0-9a-f]\{40\}\)".*/\1/p' tests/BadMango.Emulator.Tests/SingleStep/Wdc65C02VectorSet.cs)
        if [ -z "$commit" ]; then
          echo "::error::Could not read UpstreamCommit from Wdc65C02VectorSet.cs"
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Cache pinned WDC 65C02 vectors
      uses: actions/cache@v5
      with:
        path: ~/.local/share/back-pocket-emulator/singlestep/65x02/${{ steps.vectors.outputs.commit }}
        key: singlestep-wdc65c02-v1-${{ steps.vectors.outputs.commit }}

    - name: Run full SingleStepTests 65C02 vectors
      run: dotnet test tests/BadMango.Emulator.Tests/BadMango.Emulator.Tests.csproj --configuration Release --no-restore --verbosity minimal --logger trx --results-directory ./test-results/singlestep-full --settings tests/BadMango.Emulator.Tests/singlestep-full.runsettings --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: singlestep-full-results
        path: |
          test-results/singlestep-full/
        retention-days: 14
