  <text x="392" y="472" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">pocketwatch</text>
  <text x="232" y="500" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">slot 6</text>
  <text x="392" y="500" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">disk-ii-compatible</text>
  <text x="232" y="528" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">slot 3</text>
  <text x="392" y="528" fill="#E15A4A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">unknown-card</text>
  <text x="392" y="546" fill="#E15A4A" font-family="Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Incompatible card</text>
  <text x="232" y="584" fill="#E15A4A" font-family="Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Save is disabled until the ROM and the card are resolved.</text>
