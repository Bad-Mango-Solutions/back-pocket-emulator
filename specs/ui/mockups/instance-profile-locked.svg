  <title>Instance profile, locked while running</title>
  <!-- Geometric pocket marks are stand-ins for the Open Pocket and Closed Pocket glyphs. They are not traced from the character ROM. -->
  <rect x="0" y="0" width="1440" height="860" rx="0" fill="#141311" stroke="none" stroke-width="1" />
  <rect x="0" y="0" width="1440" height="32" rx="0" fill="#1B1A17" stroke="none" stroke-width="1" />
