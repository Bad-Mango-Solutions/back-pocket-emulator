  <text x="392" y="392" fill="#8E8278" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">library://roms/pocket2e-system.rom</text>
  <text x="232" y="420" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">expansion</text>
  <text x="392" y="420" fill="#8E8278" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">library://roms/80col-expansion.rom</text>
  <rect x="232" y="456" width="1176" height="1" rx="0" fill="#34302A" stroke="none" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="232" y="484" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="15" font-weight="500" text-anchor="start" dominant-baseline="central">Slots</text>
  <text x="232" y="512" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">slot 4</text>
  <text x="392" y="512" fill="#8E8278" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">pocketwatch</text>
  <text x="232" y="540" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">slot 6</text>
  <text x="392" y="540" fill="#8E8278" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">disk-ii-compatible</text>
  <text x="232" y="568" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">slot 3</text>
  <text x="392" y="568" fill="#8E8278" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Empty</text>
  <rect x="232" y="612" width="158.09375" height="28" rx="2" fill="none" stroke="#4A453C" stroke-width="1" />
  <text x="244" y="626" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Save as new template</text>
  <text x="512" y="626" fill="#8E8278" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Revert to template</text>
</svg>
