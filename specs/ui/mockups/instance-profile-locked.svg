  <text x="1356.921875" y="56" fill="#F29A2E" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">Running</text>
  <rect x="200" y="80" width="1" height="780" rx="0" fill="#34302A" stroke="none" stroke-width="1" shape-rendering="crispEdges"/>
  <rect x="0" y="96" width="2" height="24" rx="0" fill="#F29A2E" stroke="none" stroke-width="1" />
  <text x="16" y="108" fill="#F29A2E" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">Overview</text>
  <text x="16" y="136" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">CPU</text>
  <text x="16" y="164" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Memory</text>
  <text x="16" y="192" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">ROMs</text>
  <text x="16" y="220" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Motherboard</text>
  <text x="16" y="248" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Slots</text>
  <text x="16" y="276" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Drives</text>
  <text x="16" y="304" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Video</text>
  <text x="16" y="332" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Input</text>
  <text x="16" y="360" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Boot</text>
  <text x="16" y="388" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Guest OS</text>
  <text x="232" y="108" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Power the machine off to change the profile.</text>
  <rect x="232" y="136" width="1176" height="1" rx="0" fill="#34302A" stroke="none" stroke-width="1" shape-rendering="crispEdges"/>
