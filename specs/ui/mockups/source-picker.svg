<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="720" viewBox="0 0 1440 720" role="img">
  <title>ROM source picker</title>
  <!-- Geometric pocket marks are stand-ins for the Open Pocket and Closed Pocket glyphs. They are not traced from the character ROM. -->
  <rect x="0" y="0" width="1440" height="720" rx="0" fill="#0C0B09" stroke="none" stroke-width="1" />
  <rect x="360" y="80" width="720" height="520" rx="4" fill="#141311" stroke="#4A453C" stroke-width="1" />
  <text x="384" y="112" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">system-rom</text>
  <rect x="384" y="144" width="185.859375" height="28" rx="2" fill="none" stroke="#4A453C" stroke-width="1" />
  <text x="439.171875" y="158.0" fill="#F29A2E" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">From package</text>
  <rect x="494.34375" y="144" width="1" height="28" rx="0" fill="#4A453C" stroke="none" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="532.1015625" y="158.0" fill="#9C958A" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central">From file</text>
  <text x="384" y="192" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">Installed firmware</text>
  <rect x="360" y="216" width="2" height="48" rx="0" fill="#F29A2E" stroke="none" stroke-width="1" />
  <text x="384" y="232" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">Clean-room firmware</text>
  <text x="384" y="250" fill="#9C958A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">1.0.3</text>
  <rect x="384" y="263" width="672" height="1" rx="0" fill="#34302A" stroke="none" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="384" y="280" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Pocket charset</text>
  <text x="384" y="298" fill="#9C958A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">1.0.0</text>
  <rect x="384" y="311" width="672" height="1" rx="0" fill="#34302A" stroke="none" stroke-width="1" shape-rendering="crispEdges"/>
  <text x="384" y="330" fill="#8E8278" font-family="Inter, sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">Provenance</text>
  <text x="384" y="352" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">Clean-room firmware  1.0.3</text>
  <text x="384" y="388" fill="#9C958A" font-family="Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">From file copies into ~/.backpocket/roms/</text>
  <text x="384" y="406" fill="#9C958A" font-family="Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">and is stored as library://roms/…</text>
  <rect x="384" y="448" width="105.109375" height="28" rx="2" fill="#F29A2E" stroke="#F29A2E" stroke-width="1" />
  <text x="436.5546875" y="462.0" fill="#1A1208" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Use package</text>
</svg>
