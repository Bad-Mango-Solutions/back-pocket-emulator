  <circle cx="1156.6" cy="70" r="3" fill="#4A453C"/>
  <text x="1169.6" y="70" fill="#E8E2D6" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">S2 D1</text>
  <text x="1153.6" y="96" fill="#E8E2D6" font-family="Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central">bad.dsk</text>
